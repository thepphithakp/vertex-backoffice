name: Build, Push and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ตรวจว่าไม่มีความลับหลุดเข้า repo
        run: ./scripts/check-secrets.sh
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # build ผ่าน tsc ก่อน vite (ดู script build) type error จึงหยุด pipeline ตรงนี้
      - name: Build
        run: npm run build

      - name: ตรวจว่าไม่มีความลับหรือ hostname จริงหลุดเข้า repo
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(pem|key)$|kubeconfig|^\.env$|^\.env\.local$'; then
            echo "🔴 พบไฟล์ที่ไม่ควรอยู่ใน repo"
            exit 1
          fi
          # repo เป็น public — host จริงส่งตอน deploy ผ่าน secret เท่านั้น
          if git grep -n -E 'trueddns\.com|192\.168\.' -- . ':(exclude).github/workflows/*'; then
            echo "🔴 พบ hostname หรือ IP จริงในไฟล์ที่ commit"
            exit 1
          fi

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # ตั้งเป็น repository variable (ไม่ใช่ secret) — client id ไม่ใช่ความลับ
          # ไม่ตั้ง = build ผ่าน แต่ปุ่ม Google จะหายไปจากหน้า login
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kubeconfig from secret
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Deploy using Helm
        run: |
          # pipefail สำคัญ — ไม่ใส่แล้ว helm ล้มแต่ job ยังเขียว
          # เคยเกิดจริงกับ helm upgrade | tee ในอีก repo
          set -euo pipefail

          if [ -z "${{ secrets.INGRESS_HOST }}" ]; then
            echo "🔴 ต้องตั้ง secret INGRESS_HOST ก่อน — เป็น hostname จริงจึงไม่เก็บใน repo"
            exit 1
          fi

          # runId ทำให้ pod template เปลี่ยนทุกครั้งที่ workflow รัน
          # ไม่งั้นการ build commit เดิมซ้ำ (เช่น workflow_dispatch หลังแก้ variable)
          # จะได้ image ใหม่ใน tag เดิม แล้ว helm มองว่าไม่มีอะไรเปลี่ยน
          # ผลคือ deploy ขึ้นเขียวแต่ pod เก่ายังเสิร์ฟของเดิมอยู่ — เกิดจริงมาแล้ว
          helm upgrade --install vertex-backoffice ./helm/vertex-backoffice \
            --namespace vertex \
            --set image.tag=sha-${{ github.sha }} \
            --set ingress.host="${{ secrets.INGRESS_HOST }}" \
            --set-string podAnnotations.runId="${{ github.run_id }}" \
            --wait --timeout 3m

      - name: ตรวจว่า pod ตอบจริงหลัง deploy
        run: |
          set -euo pipefail
          kubectl -n vertex get pods -l app.kubernetes.io/name=vertex-backoffice
          # helm --wait ผ่านไม่ได้แปลว่าแอปเสิร์ฟไฟล์ได้ ต้องถาม readiness ซ้ำ
          kubectl -n vertex wait --for=condition=ready pod \
            -l app.kubernetes.io/name=vertex-backoffice --timeout=120s

  # ---------------------------------------------------------------------------
  # แจ้งผล deploy เข้า Discord
  # ---------------------------------------------------------------------------
  # if: always() จำเป็น — ไม่งั้น job นี้จะรันเฉพาะตอน deploy สำเร็จ
  # ซึ่งกลับหัวกลับหางกับสิ่งที่อยากได้ เพราะกรณีที่ต้องรีบรู้คือตอนมันล้ม
  #
  # needs.deploy.result เป็น skipped ได้ด้วย แปลว่า job ก่อนหน้าล้มจน deploy
  # ไม่ได้รันเลย ต้องนับเป็นความล้มเหลว ไม่ใช่ปล่อยผ่านเงียบๆ
  #
  # ⚠️ webhook URL อยู่ใน secret DISCORD_DEPLOY_WEBHOOK เท่านั้น
  #    repo นี้เป็น public ห้ามใส่ลงไฟล์เด็ดขาด
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: แจ้งผล deploy เข้า Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RESULT: ${{ needs.deploy.result }}
          SERVICE: vertex-backoffice
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # ไม่ตั้ง secret ก็ไม่ควรทำให้ workflow แดง — แค่เตือนแล้วผ่านไป
          # จะได้ fork หรือ repo ที่ยังไม่ได้ตั้งค่ายัง deploy ได้ตามปกติ
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::ยังไม่ได้ตั้ง secret DISCORD_DEPLOY_WEBHOOK — ข้ามการแจ้งเตือน"
            exit 0
          fi

          case "$RESULT" in
            success)   color=3066993;  icon="✅"; text="deploy สำเร็จ" ;;
            failure)   color=15158332; icon="❌"; text="deploy ล้มเหลว" ;;
            cancelled) color=9807270;  icon="⚪"; text="deploy ถูกยกเลิก" ;;
            skipped)   color=15158332; icon="❌"; text="deploy ไม่ได้รัน — ขั้นก่อนหน้าล้ม" ;;
            *)         color=9807270;  icon="❔"; text="deploy จบด้วยสถานะ $RESULT" ;;
          esac

          # สร้าง JSON ด้วย jq ไม่ใช่ต่อ string เอง
          # commit message มี " หรือ newline ได้ ซึ่งจะทำ payload พังเงียบๆ
          jq -n \
            --arg title "$icon $SERVICE — $text" \
            --arg sha "${GITHUB_SHA:0:7}" \
            --arg msg "$(printf '%s' "$COMMIT_MSG" | head -1 | cut -c1-120)" \
            --arg who "${GITHUB_ACTOR}" \
            --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson color "$color" \
            '{embeds:[{
               title: $title,
               url: $url,
               color: $color,
               fields: [
                 {name:"commit", value:("`"+$sha+"` "+$msg), inline:false},
                 {name:"โดย",    value:$who,  inline:true},
                 {name:"image",  value:("sha-"+$sha), inline:true}
               ],
               footer:{text:"namespace vertex"}
             }]}' > payload.json

          # --fail-with-body ทำให้ job นี้แดงถ้า Discord ปฏิเสธ
          # deploy ที่สำเร็จไปแล้วไม่ถูกย้อน แต่จะไม่เงียบว่าแจ้งเตือนไม่ออก
          curl --fail-with-body -sS -X POST \
            -H 'Content-Type: application/json' \
            -d @payload.json "$WEBHOOK"
