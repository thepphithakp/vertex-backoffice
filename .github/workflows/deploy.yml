name: Build, Push and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # build ผ่าน tsc ก่อน vite (ดู script build) type error จึงหยุด pipeline ตรงนี้
      - name: Build
        run: npm run build

      - name: ตรวจว่าไม่มีความลับหรือ hostname จริงหลุดเข้า repo
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(pem|key)$|kubeconfig|^\.env$|^\.env\.local$'; then
            echo "🔴 พบไฟล์ที่ไม่ควรอยู่ใน repo"
            exit 1
          fi
          # repo เป็น public — host จริงส่งตอน deploy ผ่าน secret เท่านั้น
          if git grep -n -E 'trueddns\.com|192\.168\.' -- . ':(exclude).github/workflows/*'; then
            echo "🔴 พบ hostname หรือ IP จริงในไฟล์ที่ commit"
            exit 1
          fi

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # ตั้งเป็น repository variable (ไม่ใช่ secret) — client id ไม่ใช่ความลับ
          # ไม่ตั้ง = build ผ่าน แต่ปุ่ม Google จะหายไปจากหน้า login
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kubeconfig from secret
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Deploy using Helm
        run: |
          # pipefail สำคัญ — ไม่ใส่แล้ว helm ล้มแต่ job ยังเขียว
          # เคยเกิดจริงกับ helm upgrade | tee ในอีก repo
          set -euo pipefail

          if [ -z "${{ secrets.INGRESS_HOST }}" ]; then
            echo "🔴 ต้องตั้ง secret INGRESS_HOST ก่อน — เป็น hostname จริงจึงไม่เก็บใน repo"
            exit 1
          fi

          # runId ทำให้ pod template เปลี่ยนทุกครั้งที่ workflow รัน
          # ไม่งั้นการ build commit เดิมซ้ำ (เช่น workflow_dispatch หลังแก้ variable)
          # จะได้ image ใหม่ใน tag เดิม แล้ว helm มองว่าไม่มีอะไรเปลี่ยน
          # ผลคือ deploy ขึ้นเขียวแต่ pod เก่ายังเสิร์ฟของเดิมอยู่ — เกิดจริงมาแล้ว
          helm upgrade --install vertex-backoffice ./helm/vertex-backoffice \
            --namespace vertex \
            --set image.tag=sha-${{ github.sha }} \
            --set ingress.host="${{ secrets.INGRESS_HOST }}" \
            --set podAnnotations.runId="${{ github.run_id }}" \
            --wait --timeout 3m

      - name: ตรวจว่า pod ตอบจริงหลัง deploy
        run: |
          set -euo pipefail
          kubectl -n vertex get pods -l app.kubernetes.io/name=vertex-backoffice
          # helm --wait ผ่านไม่ได้แปลว่าแอปเสิร์ฟไฟล์ได้ ต้องถาม readiness ซ้ำ
          kubectl -n vertex wait --for=condition=ready pod \
            -l app.kubernetes.io/name=vertex-backoffice --timeout=120s
