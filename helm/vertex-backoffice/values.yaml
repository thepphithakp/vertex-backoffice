replicaCount: 1

image:
  repository: ghcr.io/thepphithakp/vertex-backoffice
  pullPolicy: Always
  # ส่งตอน deploy เป็น sha ของ commit ไม่ใช่ latest
  # เพื่อให้รู้ได้เสมอว่า pod ที่รันอยู่มาจาก code ก้อนไหน
  tag: ""

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  # ⚠️ ห้ามใส่ค่าจริงลงไฟล์นี้ — repo เป็น public
  #    ส่งตอน deploy ด้วย --set ingress.host=...
  host: ""
  # ต้องตรงกับ base ใน vite.config.ts และ location ใน nginx.conf
  path: /backoffice
  pathType: Prefix
  annotations:
    # ingress ของ cluster นี้ยังไม่มี TLS จริง ปล่อยให้ redirect
    # จะกลายเป็น loop ที่เข้าหน้าไม่ได้เลย
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # หน้านี้ไม่มี upload อะไร ค่า default ของ nginx พอแล้ว
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
# --- Gateway API ----------------------------------------------------------
# ingress: ข้างบนยังเปิดอยู่และเป็นตัวที่รับ traffic จริง
# อันนี้คือทางเลือกใหม่ที่จะมาแทนเมื่อย้าย Gateway API เสร็จ
#
# ⚠️ ยังปิดอยู่โดยตั้งใจ — ตอนนี้ infra/gateway/07-httproute-backoffice.yaml เป็นเจ้าของ route
#    ของ vertex-backoffice อยู่ เปิดตรงนี้พร้อมกันจะได้ HTTPRoute สองตัวชี้ path เดียวกัน
#
# ลำดับที่ถูกต้องตอนย้ายมาให้ chart เป็นเจ้าของ:
#   1. kubectl apply -f infra/gateway/05-rbac-httproute.yaml   (สิทธิ์ของ CD)
#   2. kubectl delete -f infra/gateway/07-httproute-backoffice.yaml
#   3. เปลี่ยน enabled เป็น true แล้ว deploy
httpRoute:
  enabled: false
  # Gateway ที่ infra/gateway/01-gateway.yaml สร้างไว้
  parentRef:
    name: vertex-gateway
    # เว้นว่าง = namespace เดียวกับ release
    namespace: ""
    # ชื่อ listener ใน Gateway — ผูกกับ listener ตัวใดตัวหนึ่งไม่ใช่ทั้ง Gateway
    sectionName: http
  # ⚠️ ห้ามใส่ค่าจริงลงไฟล์นี้ — repo เป็น public
  #    ส่งตอน deploy เหมือน ingress.host เดิม:
  #      --set httpRoute.hostnames[0]="${{ secrets.INGRESS_HOST }}"
  #
  #    ระหว่างช่วงย้ายต้องส่ง "สองชื่อ" — ชื่อที่ cloudflared เขียน Host ทับให้
  #    กับชื่อที่เบราว์เซอร์เห็นจริง ใส่ทั้งคู่ทำให้ถอด originRequest.httpHostHeader
  #    ออกจาก cloudflared ได้ในภายหลังโดยไม่ต้องแตะ route
  #      --set httpRoute.hostnames[1]="${{ secrets.PUBLIC_HOST }}"
  #
  #    ว่างไว้แล้วเปิด enabled = helm จะ fail ทันทีพร้อมข้อความบอกเหตุ
  hostnames: []
  # ต้องตรงกับ base ใน vite.config.ts และ location ใน nginx.conf
  paths:
    - type: PathPrefix
      value: /backoffice


# static file ล้วน แทบไม่ใช้ CPU — ตั้งไว้ต่ำสุดเท่าที่ nginx อยู่ได้
# node นี้แชร์กับ ELK และ database ที่กิน memory เยอะกว่ามาก
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
