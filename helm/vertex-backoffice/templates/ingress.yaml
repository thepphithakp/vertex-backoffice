{{- if .Values.ingress.enabled }}
{{/*
  Ingress ของตัวเอง ไม่ไปแก้ vertex-ingress ที่ service อื่นใช้ร่วมกัน
  nginx รวม Ingress หลายตัวที่ host เดียวกันให้เองอยู่แล้ว
  ถ้าไฟล์นี้ผิดจะกระทบแค่ /backoffice ไม่ทำให้ API ทั้งระบบเข้าไม่ถึง

  path /backoffice ไม่ทับกับใคร — /api/v1 กับ /graphql เป็นของ service อื่น
  ส่วน / ของ host นี้เป็นของแอปอื่นในคลัสเตอร์อยู่ก่อนแล้ว
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vertex-backoffice.fullname" . }}
  labels:
    {{- include "vertex-backoffice.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ required "ต้องส่ง ingress.host ตอน deploy — ค่าจริงไม่เก็บใน repo ที่เป็น public" .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "vertex-backoffice.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
