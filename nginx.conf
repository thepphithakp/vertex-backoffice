# เสิร์ฟ SPA ที่ /backoffice — path เดียวกับ base ของ vite และ path ใน ingress
# สามที่นี้ต้องตรงกันเสมอ ถ้าตัวใดตัวหนึ่งเพี้ยนจะได้หน้าขาวโดยไม่มี error ที่ server
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # ปิดไม่ให้บอก version ของ nginx ในทุก response
    server_tokens off;

    # /backoffice (ไม่มี slash ปิดท้าย) ถูก redirect ไป /backoffice/ โดยอัตโนมัติ
    # ถ้าเป็น absolute redirect nginx จะใส่ port ที่ตัวเอง listen (8080) ลงไปด้วย
    # กลายเป็น http://host:8080/backoffice/ ซึ่งจากนอกคลัสเตอร์เข้าไม่ถึง
    # — ทดสอบแล้วเกิดจริง ปิดเพื่อให้ตอบเป็น path สัมพัทธ์แทน
    absolute_redirect off;

    # asset ของ vite มี hash อยู่ในชื่อไฟล์อยู่แล้ว เปลี่ยนเนื้อ = เปลี่ยนชื่อ
    # จึง cache ยาวได้โดยไม่เสี่ยงเห็นของเก่า
    location /backoffice/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ห้าม cache — ไม่งั้น deploy ใหม่แล้ว browser ยังชี้ asset ก้อนเก่า
    # ที่ถูกลบไปแล้ว ผลคือหน้าขาวจนกว่าจะ hard refresh
    location = /backoffice/index.html {
        add_header Cache-Control "no-store";
    }

    # ทุก path ใต้ /backoffice ตกมาที่ index.html ให้ router ฝั่ง client จัดการ
    # (/backoffice/pets ไม่มีไฟล์จริงอยู่ใน image)
    location /backoffice {
        try_files $uri $uri/ /backoffice/index.html;
    }

    # ใช้กับ probe ของ k8s — ไม่เขียน access log เพราะยิงทุกสิบวินาที
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
